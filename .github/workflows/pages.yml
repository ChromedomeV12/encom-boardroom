name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - omp/encom-archive-os
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify blog content and runtime
        run: |
          node scripts/test-blog-data.mjs
          node scripts/test-blog-runtime.mjs

      - name: Build content and canonical pages
        run: node scripts/publish-blog.mjs --site-url=https://chromedomev12.github.io/encom-boardroom --out=dist

      - name: Build browser bundle
        run: npm run build:bundle

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R build css images js blog-assets blog-data _site/
          cp -R dist/archive dist/categories dist/featured dist/posts dist/tags _site/
          cp dist/manifest.json dist/rss.xml dist/sitemap.xml _site/
          touch _site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
